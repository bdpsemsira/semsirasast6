<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEMSIRA Registration</title><link rel="icon" href="semsira.png"><style>
:root{--g:#0f5c4d;--ink:#14231f;--bg:#f4f7f6;--line:#d5dfdb;--p:#1b7f4b;--l:#a85f00;--a:#b3261e}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
header{background:var(--g);color:#fff;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center}
header img{height:40px}header h1{font-size:1.1rem;margin:0;flex:1}header nav{display:flex;flex-wrap:wrap;gap:.25rem}
header a{color:#fff;text-decoration:none;padding:.4rem .7rem;border-radius:6px}header a:hover,a:focus-visible{background:#ffffff30}
main{max-width:1100px;margin:auto;padding:1rem}section{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
h2{margin:.2rem 0 .8rem;font-size:1.2rem}label{display:block;font-weight:600;margin:.6rem 0 .2rem}
input,select,button{font:inherit;min-height:44px;padding:.4rem .6rem;border:1px solid #9bb0a9;border-radius:6px;max-width:100%}input,select{width:100%}
button{background:var(--g);color:#fff;border:0;cursor:pointer;width:auto}button.sec{background:#e3ece9;color:var(--ink)}button.del{background:var(--a)}
:focus-visible{outline:3px solid #f0b400;outline-offset:2px}.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:end}.row>*{flex:1 1 150px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:.4rem .6rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.PRESENT{color:var(--p);font-weight:700}.LATE{color:var(--l);font-weight:700}.ABSENT{color:var(--a);font-weight:700}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);max-width:92vw;padding:.7rem 1rem;border-radius:8px;color:#fff;display:none;z-index:9}
dialog{max-width:92vw;width:480px;border:0;border-radius:10px;padding:1.2rem}dialog::backdrop{background:#0008}
.muted{color:#52665f;font-size:.9rem}.pill{display:inline-block;padding:.1rem .6rem;border-radius:99px;background:#e3ece9}
</style></head><body>
<header><img src="semsira.png" alt="SEMSIRA"><h1>SEMSIRA Student Registration</h1></header>
<main><section id="closed" hidden><h2>Registration is closed</h2><p>Registration is not open right now. Please ask your teacher.</p></section>
<section id="formSec"><h2>Register your details</h2><form id="f" novalidate>
<label for="name">Name</label><input id="name" autocomplete="name" required>
<label for="ic">IC number (12 digits)</label><input id="ic" inputmode="numeric" required>
<label for="cls">Class</label><select id="cls" required></select>
<label for="tel">Contact number</label><input id="tel" type="tel" required>
<label for="mail">Email address</label><input id="mail" type="email" required>
<label for="car">Vehicle plate number (optional)</label><input id="car">
<p id="err" style="color:var(--a)" role="alert"></p><button id="go">Review details</button></form></section>
<section id="done" hidden><h2>Registered</h2><p>Your registration was saved. You can close this page.</p></section></main>
<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,getDocs,collection,query,where,deleteDoc,runTransaction,writeBatch,onSnapshot} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAg4k3N6xpljT2PZSg-V6IL1zB33nwO9fs",authDomain:"semsiraattendance.firebaseapp.com",projectId:"semsiraattendance",storageBucket:"semsiraattendance.firebasestorage.app",messagingSenderId:"962714279226",appId:"1:962714279226:web:f10d60e7b3c1e62c194403",measurementId:"G-C95Z34S4LX"};
const app=getApps().length?getApp():initializeApp(firebaseConfig);const db=getFirestore(app);
const $=s=>document.querySelector(s);
// ===== Shared business rules =====
const KOH={A:["SUMAYYAH","SARAH","KHADIJAH","FATIMAH","ZAINAB","RUQAYYAH","UMMU KALTHOM","AISHAH"],B:["AL FARABI","AL GHAZALI","AL KINDI","AL MAWARDI","AL RAZI","IBNU KHALDUN","IBNU RUSH","IBNU SINA"]};
const kohOf=c=>KOH.A.includes(c)?"A":KOH.B.includes(c)?"B":null;
const DEF={semA:1,semB:3,regOpen:true,start:"07:00",late:"07:30",absent:"08:00",scanOpen:"06:30",scanClose:"16:00"};
const fmtMY=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kuala_Lumpur",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
function myParts(d=new Date()){const p=Object.fromEntries(fmtMY.formatToParts(d).map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`,sec:p.second}}
const myNow=()=>myParts();
const myStamp=iso=>{if(!iso)return"";const p=myParts(new Date(iso));return`${p.date} ${p.time}:${p.sec}`};
function normIC(v){const s=String(v??"").trim();if(!/^\d+$/.test(s))return null;if(s.length===11)return"0"+s;return s.length===12?s:null}
async function getSettings(){const d=await getDoc(doc(db,"settings","main"));return{...DEF,...(d.exists()?d.data():{})}}
async function isSchoolDay(date){const w=new Date(date+"T00:00:00Z").getUTCDay();if(w===0||w===6)return false;return !(await getDoc(doc(db,"holidays",date))).exists()}
function toast(m,t="ok"){const e=$("#toast");e.textContent=m;e.style.background=t==="ok"?"#1b7f4b":"#b3261e";e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4500)}
function confirmBox(html,okText="Confirm"){return new Promise(r=>{const d=$("#dlg");$("#dlgBody").innerHTML=html;$("#dlgOk").textContent=okText;d.returnValue="";d.onclose=()=>r(d.returnValue==="ok");d.showModal()})}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dlgHTML=`<dialog id="dlg"><form method="dialog"><div id="dlgBody"></div><div class="row" style="margin-top:1rem"><button class="sec" value="cancel">Cancel</button><button id="dlgOk" value="ok"></button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div>`;
document.body.insertAdjacentHTML("beforeend",dlgHTML);
// ===== Registration =====
$("#cls").innerHTML='<option value="">Select class</option>'+["A","B"].map(k=>`<optgroup label="KOHORT ${k}">${KOH[k].map(c=>`<option>${c}</option>`).join("")}</optgroup>`).join("");
async function checkOpen(){const s=await getSettings();$("#closed").hidden=s.regOpen;$("#formSec").hidden=!s.regOpen||!$("#done").hidden;return s.regOpen}
checkOpen().catch(e=>{toast("Cannot reach database: "+e.message,"err")});
$("#f").addEventListener("submit",async e=>{e.preventDefault();$("#err").textContent="";
 const v={name:$("#name").value.trim().replace(/\s+/g," "),ic:normIC($("#ic").value),cls:$("#cls").value,tel:$("#tel").value.trim(),mail:$("#mail").value.trim(),car:$("#car").value.trim()};
 const er=[];if(!v.name)er.push("Name is required.");if(!v.ic)er.push("IC must be 12 digits (11 digits get a leading zero added). No other characters allowed.");
 if(!kohOf(v.cls))er.push("Choose a class.");if(!v.tel)er.push("Contact number is required.");if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.mail))er.push("Enter a valid email address.");
 if(er.length){$("#err").textContent=er.join(" ");return}
 const ok=await confirmBox(`<h2>Check your details</h2><p>Name: <b>${esc(v.name)}</b><br>IC: <b>${v.ic}</b><br>Class: <b>${esc(v.cls)}</b> (Kohort ${kohOf(v.cls)})<br>Contact: <b>${esc(v.tel)}</b><br>Email: <b>${esc(v.mail)}</b><br>Vehicle: <b>${esc(v.car)||"-"}</b></p>`,"Confirm and register");
 if(!ok)return;$("#go").disabled=true;
 try{if(!await checkOpen()){toast("Registration just closed. Nothing was saved.","err");return}
  const ref=doc(db,"students",v.ic);
  await runTransaction(db,async t=>{if((await t.get(ref)).exists())throw new Error("DUP");
   t.set(ref,{studentId:v.ic,StudentName:v.name,IC:v.ic,Class:v.cls,Kohort:kohOf(v.cls),ContactNumber:v.tel,EmailAddress:v.mail,VehiclePlateNumber:v.car,registeredAt:new Date().toISOString(),regDate:myNow().date})});
  $("#formSec").hidden=true;$("#done").hidden=false;
 }catch(x){$("#go").disabled=false;toast(x.message==="DUP"?"This IC is already registered.":"Could not save: "+x.message,"err")}});
</script></body></html>
